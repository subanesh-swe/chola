bind_address: "0.0.0.0:50051"
http_port: 8080

# Interface the REST/HTTP server (dashboard + API) binds to.
# Default is 127.0.0.1 (loopback only — secure by default).
# To reach it over LAN or Tailscale, set one of:
#   "0.0.0.0"      all interfaces (relies on token auth + firewall/VPN)
#   "100.x.y.z"    the host's Tailscale IP — exposed only over the tailnet (best)
# Leave as 127.0.0.1 and put a reverse proxy (nginx/Traefik) in front for prod.
http_bind_address: "127.0.0.1"

# Optional TLS for the REST API (HTTP server). Leave commented out for plain HTTP (dev).
# For production with auth enabled: configure http_tls OR use a reverse proxy (nginx) with TLS.
# Without TLS, credentials and tokens are transmitted in plaintext.
# http_tls:
#   enabled: true
#   server_cert: "/etc/chola/certs/server.crt"
#   server_key: "/etc/chola/certs/server.key"

storage:
  postgres:
    host: localhost
    port: 5432
    database: choladb
    user: chola_app
    password: chola_app_secret
    max_connections: 10
    schema: chola

redis:
  host: localhost
  port: 6379
  key_prefix: "chola:"

scheduling:
  strategy: "best-fit"
  nvme_preference: true
  branch_affinity: true

workers:
  heartbeat_interval_secs: 3
  heartbeat_timeout_secs: 10
  max_reconnect_attempts: 5
  idle_timeout_secs: 300       # 5 min — reserved but no stage submitted
  stall_timeout_secs: 1800     # 30 min — running but no activity

auth:
  enabled: true
  jwt_secret: "change-me-in-production-use-a-long-random-string"
  jwt_expiry_secs: 86400
  default_admin_username: "admin"
  default_admin_password: "changeme"
  # AES-256-GCM key for encrypting secret pipeline variables at rest.
  # Omit to store plaintext (backward compatible).
  # encryption_key: "change-me-32-char-secret-key-here"

retention:
  max_builds_per_repo: 5000
  t1_purge_files_after_days: 7
  t2_archive_after_days: 30
  t3_delete_archive_after_days: 365
  cleanup_interval_secs: 3600
  enable_worker_fanout: false

# Path resolution: $CHOLA_HOME > $XDG_DATA_HOME/chola > ~/.local/share/chola
# For production systemd: set Environment=CHOLA_HOME=/var/lib/chola
logging:
  level: "info"
  # log_dir defaults to $CHOLA_HOME/controller/logs if omitted